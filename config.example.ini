# KlAutoCheck 配置示例
# 复制本文件，填好值，然后把整段内容存到仓库 Secret 的 KL_CONFIG 里
# 规则：键名不区分大小写；= 和 : 都行；# 开头是注释；行尾 # 注释 也可以

# ===== 通知配置（全局，四选一或多选，只配你用的）=====

[telegram]
bot_token = 123456789:AAxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
chat_id = 1008610086

[serverchan]
sendkey = SCT123456XXXXXXXXXXXXXXXXXXXXXXXXXXXX

[pushplus]
token = 你的pushplus_token

[mail]
smtp_server = smtp.qq.com          # 465 走 SSL，其他端口走 STARTTLS
smtp_port = 465
user = 你的QQ号@qq.com
pass = 邮箱授权码                   # 不是登录密码，是 QQ 邮箱设置里生成的授权码
from = KlAutoCheck <你的QQ号@qq.com> # 可不写，不写就用 user
mail_to = me@example.com            # 收件人，多个用逗号分隔

# ===== 账号（[account] 出现几次就是几个账号）=====

[account]
name = 主账号
cookie = 把浏览器里复制的完整Cookie粘到这里
tasks = checkin,wheel               # 要执行的任务，逗号分隔
wheel_times = 1                     # 转盘次数 1~3（每次消耗 2 蒸汽）

[account]
name = 小号
cookie = 另一个账号的Cookie
tasks = checkin                     # 小号可能不满足转盘条件，只签到
