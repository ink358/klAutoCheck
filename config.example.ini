# KlAutoCheck config example
# Copy this file, fill in your values, then paste the whole text into the
# repository secret KL_CONFIG.
# Rules: keys are case-insensitive; = and : both work; # starts a comment;
# inline comments after a value are also supported.

# ===== Notification config (global, configure only what you use) =====

[telegram]
bot_token = 123456789:AAxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
chat_id = 1008610086

[serverchan]
sendkey = SCT123456XXXXXXXXXXXXXXXXXXXXXXXXXXXX

[pushplus]
token = your_pushplus_token

[mail]
smtp_server = smtp.qq.com          # port 465 uses SSL, other ports use STARTTLS
smtp_port = 465
user = you@qq.com
pass = your_smtp_auth_code         # not the login password
from = KlAutoCheck <you@qq.com>    # optional, defaults to user
mail_to = me@example.com           # recipients, comma-separated

# ===== Accounts (one [account] block per account) =====

[account]
name = main
cookie = paste_the_full_cookie_line_copied_from_the_browser_here
tasks = checkin,wheel              # tasks to run, comma-separated
wheel_times = 1                    # wheel rolls 1~3 (consumes 2 credits per roll)

[account]
name = alt
cookie = another_accounts_cookie
tasks = checkin                    # alt account may not meet wheel requirements
